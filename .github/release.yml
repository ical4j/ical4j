# Categories for GitHub's automatically generated release notes.
# https://docs.github.com/en/repositories/releasing-projects-on-github/automatically-generated-release-notes
changelog:
  exclude:
    labels:
      - invalid
      - duplicate
      - wontfix
  categories:
    - title: Bug fixes
      labels:
        - bug
    - title: Enhancements
      labels:
        - enhancement
    - title: Dependencies
      labels:
        - dependencies
    - title: Maintenance
      labels:
        - tech debt
        - task
    - title: Other changes
      labels:
        - "*"
