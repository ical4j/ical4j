name: Feature request
description: Suggest an improvement or new capability
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        For open-ended ideas or "how do I…" questions, [Discussions](https://github.com/orgs/ical4j/discussions)
        is often a better place to start.

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what makes it hard with iCal4j today?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: |
        What you'd like to happen. A code sketch of the API you have in mind helps. If this relates to an RFC
        (5545, 5546, 7986, 9073, 9253, …), name the section.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Workarounds you're using now, or other approaches you thought about.

  - type: checkboxes
    id: contribute
    attributes:
      label: Contribution
      options:
        - label: I'd be willing to open a pull request for this
